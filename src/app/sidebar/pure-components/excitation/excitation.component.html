<div class="frequency-row" [formGroup]="form">
  <mat-form-field subscriptSizing="dynamic">
    <mat-label>Frequency</mat-label>
    <input matInput type="number" formControlName="excitationFrequencyBase" min="0" step="1" />
  </mat-form-field>
  <mat-button-toggle-group
    aria-label="Frequency unit"
    hideSingleSelectionIndicator
    formControlName="excitationFrequencyMultiplier"
  >
    <mat-button-toggle value="Hz"> Hz </mat-button-toggle>
    <mat-button-toggle value="kHz"> kHz </mat-button-toggle>
    <mat-button-toggle value="MHz"> MHz </mat-button-toggle>
  </mat-button-toggle-group>
</div>

<app-taper />
